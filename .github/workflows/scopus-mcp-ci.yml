name: Scopus MCP - Build and test
on:
  push:
    paths: ['mcp/scopus-mcp/**', '.github/workflows/scopus-mcp-ci.yml']
  pull_request:
    paths: ['mcp/scopus-mcp/**', '.github/workflows/scopus-mcp-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/scopus-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/scopus-mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RUN_BROWSER_TESTS: '1'
