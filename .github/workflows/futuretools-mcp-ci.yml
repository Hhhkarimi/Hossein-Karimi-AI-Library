name: FutureTools MCP - Build and test
on:
  push:
    paths: ['mcp/futuretools-mcp/**', '.github/workflows/futuretools-mcp-ci.yml']
  pull_request:
    paths: ['mcp/futuretools-mcp/**', '.github/workflows/futuretools-mcp-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/futuretools-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/futuretools-mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
